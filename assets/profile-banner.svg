      <path d="M611 100c88-42 160-35 229 0s142 33 230-8 153-30 218 11"/>
      <path d="M598 130c91-43 170-40 244 0s149 36 239-5 160-29 226 16"/>
    </g>

    <path d="M0 322 120 226l65 44 88-93 88 94 86-65 85 58 89-103 96 106 82-57 73 50 95-100 88 101 105-74v173H0Z" fill="#09111e" opacity=".88"/>
    <path d="m0 322 120-96 65 44 88-93 88 94 86-65 85 58 89-103 96 106 82-57 73 50 95-100 88 101 105-74" fill="none" stroke="#5eead4" stroke-opacity=".22"/>

    <g transform="translate(940 42) scale(.9)">
      <circle cx="112" cy="90" r="72" fill="#5eead4" opacity=".1" filter="url(#soft)"/>
      <path d="M27 91c51-49 121-60 183-28-31 3-58 12-82 27-24-8-57-8-101 1Z" fill="url(#glow)" opacity=".95"/>
      <path d="M27 91c31 1 66 7 101-1 27-16 52-24 82-27" fill="none" stroke="#d5fffa" stroke-opacity=".85"/>
      <path d="M128 90 114 150m14-60 24 60m-38 0h38" fill="none" stroke="#d5fffa" stroke-width="1.5" stroke-opacity=".85"/>
