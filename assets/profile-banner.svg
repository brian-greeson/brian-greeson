      <text x="0" y="72" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="750" letter-spacing="-2">Brian Greeson</text>
      <text x="2" y="117" fill="#99f6e4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" letter-spacing="2.2">FULL-STACK ENGINEER · PRODUCT BUILDER</text>
      <text x="2" y="164" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">Maps, connected devices, and software for the real world.</text>
